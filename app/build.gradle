apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.firebase-perf'
// Remove: apply plugin: 'io.fabric'

android {
    compileSdkVersion 33  // Update from 28
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11  // Match JDK 11 from workflow
        targetCompatibility JavaVersion.VERSION_11
    }
    defaultConfig {
        applicationId "com.buzz.vpn"
        minSdkVersion 21
        targetSdkVersion 33  // Update from 28
        vectorDrawables.useSupportLibrary = true
        versionCode 37
        versionName "2.8.2000"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        resConfigs "en", "zh-rCN"
    }
    // ... rest of configuration
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.browser:browser:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.1.1'

    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-perf:20.5.0'
    implementation 'com.google.firebase:firebase-crashlytics:18.6.0'  // Replace Fabric Crashlytics

    implementation 'com.airbnb.android:lottie:5.2.0'
    implementation 'com.google.android.gms:play-services-base:18.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.annotation:annotation:1.6.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}

apply plugin: 'com.google.gms.google-services'
